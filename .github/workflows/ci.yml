name: SmartGrow AI — CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  firmware-tests:
    name: Embedded Firmware & TinyML Parity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install GCC Compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile and Run Firmware Native Tests
        run: |
          gcc -Wall -Wextra -I firmware/include \
            firmware/src/sensor_calibration.c \
            firmware/src/sensor_manager.c \
            firmware/src/safety_manager.c \
            firmware/src/actuator_manager.c \
            firmware/src/command_manager.c \
            firmware/src/telemetry_client.c \
            firmware/src/edge_ai_model.c \
            firmware/src/edge_ai.c \
            firmware/test/test_firmware_native.c \
            -o test_firmware_native
          ./test_firmware_native

      - name: Compile and Run Edge AI C Parity Test
        run: |
          gcc -Wall -Wextra -I firmware/include \
            firmware/src/edge_ai_model.c \
            firmware/test/test_ai_parity.c \
            -o test_ai_parity
          ./test_ai_parity

  backend-tests:
    name: FastAPI Backend & End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: "."
        run: |
          pytest backend/tests/test_backend_api.py -v

      - name: Run Full End-to-End Vertical Integration Test
        env:
          PYTHONPATH: "."
        run: |
          python tests/integration/test_end_to_end_flow.py

      - name: Run HIL Runner (Simulation Mode)
        run: |
          python tests/hil/hil_runner.py

  frontend-build:
    name: Frontend Vue 3 & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck and Build Bundle
        working-directory: frontend
        run: npm run build
